name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate PWA Android App
        uses: pwabuilder/pwabuilder-android-action@v2
        with:
          url: 'https://lazon75.github.io/StreamVibe-Ultimate-Pro/'
          name: 'StreamVibe Pro'
          icon: 'https://lazon75.github.io/StreamVibe-Ultimate-Pro/icon.png'
          output: 'apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVibe-Pro-APK
          path: apk/*.apk


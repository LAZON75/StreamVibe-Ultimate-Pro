name: APK workflow

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build App
        run: |
          npm i -g @pwabuilder/bubblewrap
          bubblewrap update --manifest https://lazon75.github.io/StreamVibe-Ultimate-Pro/manifest.json || bubblewrap init --manifest https://lazon75.github.io/StreamVibe-Ultimate-Pro/manifest.json -d

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

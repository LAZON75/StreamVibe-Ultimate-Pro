<!DOCTYPE html>
<html lang="ar" dir="rtl" id="r">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVibe Pro</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{--bg:#030308;--pri:#00d2ff;--glow:rgba(0,210,255,.4);--pink:#d81b60;--green:#00e676;--txt:#fff;--mut:#8c8c9e;--card:rgba(15,18,30,.88);--hover:rgba(25,30,48,.95);--bd:rgba(255,255,255,.12);--side:#0e1322;--chan:#0f1528}
body.light{--bg:#f0f2f5;--txt:#1a1a1a;--mut:#555;--card:rgba(255,255,255,.92);--hover:#e6f0ff;--bd:rgba(0,0,0,.15);--side:#e4e8f0;--chan:#dce1ec}
*{box-sizing:border-box;margin:0;padding:0;outline:none}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Tahoma,system-ui,sans-serif;min-height:100vh;transition:.3s}
button,input,select{font-family:inherit}
.nav{position:fixed;top:0;inset-inline:0;background:var(--card);padding:12px 5vw;z-index:100;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
.logo{color:var(--pri);font-size:24px;font-weight:900;letter-spacing:2px;text-shadow:0 0 20px var(--glow)}
.badge{font-size:10px;background:var(--pink);color:#fff;padding:2px 6px;border-radius:4px;margin-inline-start:6px}
.inp{background:var(--card);border:1px solid var(--bd);padding:9px 16px;border-radius:20px;color:var(--txt);font-size:13px;width:230px;max-width:100%}
.hero{margin-top:62px;min-height:420px;display:flex;align-items:center;padding:40px 5vw;background:linear-gradient(90deg,rgba(3,3,8,.95) 30%,rgba(3,3,8,.5)),url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=1600') center/cover;border-bottom:1px solid var(--bd)}
.hero h1{font-size:clamp(28px,5vw,46px);font-weight:900;margin:12px 0;color:#fff}
.hero p{color:#fff;max-width:600px;line-height:1.6;margin-bottom:22px}
.tag{background:var(--pri);color:#000;padding:4px 12px;font-size:11px;font-weight:800;border-radius:4px}
.btn{background:var(--pri);color:#000;border:0;padding:13px 28px;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;box-shadow:0 5px 20px var(--glow);transition:.2s}
.btn:hover{transform:translateY(-2px)}
h2.t{font-size:21px;margin:30px 5vw 16px;display:flex;align-items:center;gap:10px}
h2.t:before{content:'';width:6px;height:22px;background:var(--pri);border-radius:3px}
.grid{padding:0 5vw 50px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:18px;height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;cursor:pointer;transition:.3s;font-size:18px;font-weight:700}
.card span{font-size:38px}
.card:hover,.card:focus{transform:translateY(-6px);border-color:var(--pri);box-shadow:0 0 30px var(--glow);background:var(--hover)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:4000;justify-content:center;align-items:center;backdrop-filter:blur(12px)}
.box{background:var(--side);width:92%;max-width:480px;border-radius:16px;border:1px solid var(--bd);padding:22px}
.box h3{display:flex;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd);font-size:17px}
.box h3 b{cursor:pointer}
.box .inp,.box select{width:100%;border-radius:8px;margin-bottom:12px;padding:12px}
#settings{display:none;position:fixed;inset:0;background:var(--bg);z-index:3000;padding:24px 5vw;overflow-y:auto}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px}
.sb{background:rgba(216,27,96,.85);border-radius:14px;padding:20px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#fff;font-weight:700;transition:.2s}
.sb.on{background:rgba(0,200,100,.9)}.sb:hover{transform:scale(1.03)}
#live{display:none;position:fixed;inset:0;background:var(--bg);z-index:2000;grid-template-columns:250px 320px 1fr;grid-template-rows:56px 1fr}
.lh{grid-column:1/-1;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--bd);gap:10px}
.lh b{color:var(--pri)}
.tabs{display:flex;gap:4px;padding:8px;background:var(--side);border-bottom:1px solid var(--bd)}
.tab{flex:1;text-align:center;padding:7px 2px;font-size:12px;font-weight:700;border-radius:6px;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--pri);color:#000}
.col{display:flex;flex-direction:column;overflow:hidden;border-inline-end:1px solid var(--bd)}
#side{background:var(--side)}#chs{background:var(--chan)}
.list{overflow-y:auto;flex:1}
.it{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;border-inline-start:3px solid transparent}
.it:hover,.it.on,.it:focus{background:rgba(0,210,255,.12);color:var(--txt);border-inline-start-color:var(--pri)}
.ch{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px;font-weight:600}
.ch:hover,.ch.on,.ch:focus{background:rgba(0,210,255,.2)}
.ch img,.ch i{width:30px;height:30px;object-fit:contain;border-radius:4px;background:rgba(255,255,255,.06);flex-shrink:0;font-style:normal;display:flex;align-items:center;justify-content:center}
.ch .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:#777;font-size:18px;padding:0 4px}.star.on{color:#ffbb00}
.cnt{padding:8px 14px;font-size:11px;color:var(--mut)}
.pl{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap;align-items:center}
.cb{background:var(--card);border:1px solid var(--bd);color:var(--txt);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.cb:hover{background:var(--pri);color:#000}
.vid{flex:1;background:#000;position:relative;min-height:0}
.vid video{width:100%;height:100%;object-fit:contain}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:rgba(0,0,0,.6);font-size:15px;pointer-events:none}
.np{padding:12px 20px;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-between;font-size:14px}
.sc{display:flex;gap:6px;padding:6px 10px}.sc .cb{flex:1;font-size:18px;padding:8px}
.cb:focus,.tab:focus,.btn:focus,.card:focus{outline:3px solid var(--pri)}
.ld{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:900px){
#live{grid-template-columns:1fr;grid-template-rows:56px 38vh 1fr}
.pl{grid-row:2;grid-column:1}
#side{display:none}#side.show{display:flex;position:absolute;inset:56px 0 0 0;z-index:5}
#chs{grid-row:3;border:0}
.inp{width:140px}.nav .inp{display:none}
}

.hero2{margin-top:62px;min-height:540px;position:relative;overflow:hidden;display:flex;align-items:center;padding:50px 5vw;background:linear-gradient(120deg,#07142e,#2b0a45,#00354a,#07142e);background-size:300% 300%;animation:shift 14s ease infinite;border-bottom:1px solid var(--bd)}
@keyframes shift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 9s ease-in-out infinite alternate}
.o1{width:340px;height:340px;background:#00d2ff;inset-block-start:-80px;inset-inline-end:8%}
.o2{width:300px;height:300px;background:#d81b60;inset-block-end:-90px;inset-inline-start:20%;animation-delay:-4s}
@keyframes fl{to{transform:translate(40px,30px) scale(1.15)}}
.hin{position:relative;z-index:2;max-width:760px}
.hin h1{font-size:clamp(32px,6vw,58px);font-weight:900;margin:16px 0;color:#fff;line-height:1.15;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.hin p{color:#dfe8ff;font-size:17px;line-height:1.7;margin-bottom:26px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d81b60;box-shadow:0 0 10px #d81b60;animation:pu 1.2s infinite}
@keyframes pu{50%{opacity:.3}}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none;display:inline-flex;gap:6px;align-items:center;backdrop-filter:blur(8px)}
.btn:focus{outline:3px solid #fff}
.stats{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;color:#bcd}.stats b{font-size:28px;color:var(--pri);text-shadow:0 0 18px var(--glow)}.stats span{font-size:12px}
.chips{display:flex;gap:12px;overflow-x:auto;padding:4px 5vw 14px;scroll-snap-type:x proximity}
.chip{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--bd);padding:12px 22px;border-radius:40px;font-weight:700;font-size:15px;cursor:pointer;transition:.25s}
.chip span{font-size:26px}
.chip:hover,.chip:focus{border-color:var(--pri);box-shadow:0 0 22px var(--glow);transform:translateY(-3px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;padding:0 5vw 10px}
.tile{height:104px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;transition:.25s;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.tile span{font-size:32px}
.tile:hover,.tile:focus{transform:scale(1.06);outline:3px solid #fff}
.g0{background:linear-gradient(135deg,#0072ff,#00c6ff)}.g1{background:linear-gradient(135deg,#d81b60,#ff7a59)}.g2{background:linear-gradient(135deg,#11998e,#38ef7d)}.g3{background:linear-gradient(135deg,#6a11cb,#2575fc)}.g4{background:linear-gradient(135deg,#f7971e,#d4501e)}.g5{background:linear-gradient(135deg,#8e2de2,#d81b60)}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:30px 5vw 40px;border-top:1px solid var(--bd);margin-top:20px}
.ib{position:absolute;top:14px;inset-inline-start:14px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.72);color:#fff;padding:8px 18px;border-radius:12px;opacity:0;transition:.4s;pointer-events:none;font-size:18px}
.ib.on{opacity:1}.ib img{height:34px;max-width:60px;object-fit:contain}
.tile i{font-style:normal}
.tiles.big{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.tile.big{height:200px;font-size:26px;border-radius:22px}.tile.big span{font-size:64px}
.tiles.sm{margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#live.nosid{grid-template-columns:340px 1fr}.nosid #side{display:none}
@media(max-width:900px){#live.nosid{grid-template-columns:1fr}}
.hero2{background:#030308;animation:none}
.hero2:before{content:"";position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=1600&auto=format&fit=crop') center/cover;animation:zm 24s ease-in-out infinite alternate}
@keyframes zm{to{transform:scale(1.12)}}
.nav{background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);border:0}
.logo{background:linear-gradient(90deg,#00d2ff,#ff2d75);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:28px}
.badge{-webkit-text-fill-color:#fff}
.hero2{margin-top:0;min-height:82vh;padding-top:90px;border:0}
.hin{max-width:640px}.hin h1{font-size:clamp(34px,6.5vw,66px)}
.hero2 .btn{background:#fff;color:#000;box-shadow:none;font-size:18px;padding:14px 34px}
.hero2 .btn.ghost{background:rgba(109,109,110,.75);color:#fff}
.mini{margin-top:26px;color:#cfd8ee;font-size:14px}.mini b{color:#fff}
.rowt{font-size:21px;font-weight:800;margin:6px 5vw 0}
.row{display:flex;gap:26px;overflow-x:auto;padding:26px 5vw 44px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.ch,.it{border-radius:12px;margin:5px 10px}.ch{border:0;background:rgba(255,255,255,.04)}
.ch:hover,.ch.on,.ch:focus{background:rgba(255,45,117,.28);transform:scale(1.02)}
.tab.on{background:linear-gradient(90deg,#d81b60,#ff5a8a);color:#fff}
</style>
</head>
<body onload="init()">

<div class="nav">
 <div class="logo">StreamVibe<span class="badge">PRO</span></div>
 <input class="inp" id="gs" data-ph="search" oninput="gsearch(this.value)">
</div>

<div class="hero2">
 <div class="hin">
  <span class="tag"><i class="dot"></i> <span data-i="tag"></span></span>
  <h1 data-i="hTitle"></h1>
  <p data-i="hDesc"></p>
  <div class="btns">
   <button class="btn" onclick="openSection('live')" data-i="launch"></button>
   <button class="btn ghost" id="contBtn" onclick="continueLast()" style="display:none">⏯ <span data-i="cont"></span>: <b id="contName"></b></button>
  </div>
  <div class="stats"><div><b>40+</b><span data-i="stC"></span></div><div><b>10K+</b><span data-i="stCh"></span></div><div><b>HD</b><span data-i="stQ"></span></div><div><b>0$</b><span data-i="stFree"></span></div></div>
 </div>
</div>

<h2 class="t" data-i="menu"></h2>
<div class="tiles big" style="padding:0 5vw">
 <div class="tile big g0" tabindex="0" onclick="openSection('live')"><span>📡</span><i data-i="liveTV"></i></div>
 <div class="tile big g1" tabindex="0" onclick="openSection('movies')"><span>🎬</span><i data-i="movies"></i></div>
 <div class="tile big g3" tabindex="0" onclick="openSection('series')"><span>📺</span><i data-i="series"></i></div>
</div>
<div class="tiles sm" style="padding:10px 5vw">
 <div class="tile g0" tabindex="0" onclick="quick('sports')"><span>⚽</span><i data-i="sports"></i></div>
 <div class="tile g1" tabindex="0" onclick="quick('news')"><span>📰</span><i data-i="news"></i></div>
 <div class="tile g2" tabindex="0" onclick="quick('kids')"><span>🧸</span><i data-i="kids"></i></div>
 <div class="tile g3" tabindex="0" onclick="quick('documentary')"><span>🌿</span><i data-i="documentary"></i></div>
 <div class="tile g4" tabindex="0" onclick="openSection('live','f')"><span>⭐</span><i data-i="fav"></i></div>
 <div class="tile g2" tabindex="0" onclick="$('settings').style.display='block'"><span>⚙️</span><i data-i="settings"></i></div>
</div>
<div class="foot" data-i="foot"></div>

<div id="settings" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:3000;padding:24px 5vw;overflow-y:auto">
 <div style="display:flex;justify-content:space-between;align-items:center">
  <b style="cursor:pointer;font-size:18px" onclick="$('settings').style.display='none'" data-i="back"></b>
  <h2 style="font-size:24px" data-i="settings"></h2><span style="width:50px"></span>
 </div>
 <div class="sgrid">
  <div class="sb" onclick="openM('mPl')">🔗 <span data-i="addPl"></span></div>
  <div class="sb" id="bPar" onclick="togglePar()">🔒 <span data-i="par"></span></div>
  <div class="sb" onclick="openM('mLang')">🌐 <span data-i="lang"></span></div>
  <div class="sb" onclick="toggleTheme()">🎨 <span data-i="theme"></span></div>
  <div class="sb" id="bExt" onclick="toggleExt()">▶️ <span data-i="ext"></span></div>
  <div class="sb" onclick="clearHist()">🗑️ <span data-i="clear"></span></div>
 </div>
</div>

<div class="ov" id="mPl"><div class="box">
 <h3><span data-i="addPl"></span><b onclick="closeM('mPl')">✕</b></h3>
 <input class="inp" id="mUrl" placeholder="https://example.com/list.m3u" dir="ltr">
 <button class="btn" style="width:100%" onclick="addCustom()" data-i="load"></button>
</div></div>
<div class="ov" id="mLang"><div class="box">
 <h3><span data-i="lang"></span><b onclick="closeM('mLang')">✕</b></h3>
 <select id="langSel"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>
 <button class="btn" style="width:100%" onclick="setLang($('langSel').value);closeM('mLang')" data-i="save"></button>
</div></div>
<div class="ov" id="mPin"><div class="box" style="text-align:center;max-width:340px">
 <h3><span data-i="pin"></span><b onclick="closeM('mPin')">✕</b></h3>
 <input class="inp" id="pinIn" type="password" maxlength="4" inputmode="numeric" style="text-align:center;font-size:20px;letter-spacing:6px">
 <button class="btn" style="width:100%" onclick="checkPin()" data-i="ok"></button>
</div></div>

<div id="live">
 <div class="lh">
  <div><b id="lt">StreamVibe</b></div>
  <input class="inp" id="cs" data-ph="search" oninput="renderCh()">
  <button class="cb" onclick="closeLive()" data-i="home"></button>
 </div>
 <div class="col" id="side">
  <div class="tabs">
   <div class="tab" data-t="c" data-i="tCountries"></div>
   <div class="tab" data-t="k" data-i="tCats"></div>
   <div class="tab" data-t="f" data-i="tFav"></div>
   <div class="tab" data-t="r" data-i="tRecent"></div>
  </div>
  <div class="sc"><button class="cb" onclick="scr('sideList',-1)">▲</button><button class="cb" onclick="scr('sideList',1)">▼</button></div>
  <div class="list" id="sideList"></div>
 </div>
 <div class="col" id="chs">
  <div class="cnt" id="cnt"></div>
  <div class="sc"><button class="cb" onclick="scr('chList',-1)">▲</button><button class="cb" onclick="scr('chList',1)">▼</button></div>
  <div class="list" id="chList"></div>
 </div>
 <div class="pl">
  <div class="bar">
   <button class="cb" onclick="$('side').classList.toggle('show')" id="bMenu">☰</button>
   <select class="cb" id="qSel" onchange="setQ(this.value)"><option value="-1">Auto</option></select>
   <button class="cb" onclick="fs()">⛶</button>
   <button class="cb" onclick="pip()">PiP</button>
   <button class="cb" onclick="aspect()">📐</button>
   <button class="cb" onclick="mute()">🔊</button><button class="cb" onclick="zap(-1)">⏮</button><button class="cb" onclick="zap(1)">⏭</button>
  </div>
  <div class="vid"><video id="v" controls autoplay playsinline></video><div id="msg" style="display:none"></div><div id="ib" class="ib"></div></div>
  <div class="np" id="np"></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const BASE='https://iptv-org.github.io/iptv/';
const flag=c=>String.fromCodePoint(...[...(c==='uk'?'gb':c).toUpperCase()].map(x=>127397+x.charCodeAt(0)));

};
let lang=LS.g('lang','ar'),tab='c',cur=[],curLabel='',curKey='',hls=null,favs=LS.g('favs',[]),recent=LS.g('recent',[]),cache={},pending=null,activeUrl='';
const t=k=>(T[lang]||T.ar)[k];

function init(){
 if(LS.g('theme','dark')==='light')document.body.classList.add('light');
 setLang(lang);syncBtns();
 $('side').addEventListener('click',e=>{
  const tb=e.target.closest('[data-t]');if(tb){tab=tb.dataset.t;renderSide();return}
  const el=e.target.closest('[data-u]');if(el){$('side').classList.remove('show');loadList(el.dataset.u,el.dataset.l)}
 });
 $('chList').addEventListener('click',e=>{
  const s=e.target.closest('[data-fav]');
  if(s){toggleFav(+s.dataset.fav);return}
  const c=e.target.closest('[data-i]');if(c)play(view[+c.dataset.i]);
 });
}

function setLang(l){
 lang=l;LS.s('lang',l);
 const r=$('r');r.lang=l;r.dir=l==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>{if(T[l][e.dataset.i]!==undefined&&!e.closest('#chList'))e.textContent=t(e.dataset.i)});
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('langSel').value=l;renderSide();renderCh();renderHome();
}
function syncBtns(){$('bPar').classList.toggle('on',!!LS.g('par',false));$('bExt').classList.toggle('on',!!LS.g('ext',false))}
function toggleTheme(){const l=document.body.classList.toggle('light');LS.s('theme',l?'light':'dark')}
function toggleExt(){LS.s('ext',!LS.g('ext',false));syncBtns()}
function togglePar(){
 if(LS.g('par',false)){LS.s('par',false);syncBtns();return}
 const p=prompt(t('pinNew'),'1234');
 if(p&&/^\d{4}$/.test(p)){LS.s('pin',p);LS.s('par',true);syncBtns()}
}
function clearHist(){recent=[];LS.s('recent',[]);renderSide();alert(t('cleared'))}
function openM(id){$(id).style.display='flex'}
function closeM(id){$(id).style.display='none'}

function openLive(tb,after){
 pending=()=>{$('live').style.display='grid';if(tb){tab=tb}renderSide();renderCh();if(after)after()};
 if(LS.g('par',false)){$('pinIn').value='';openM('mPin');return}
 pending();
}
function checkPin(){
 if($('pinIn').value===LS.g('pin','1234')){closeM('mPin');pending&&pending()}else alert(t('pinBad'));
}
function closeLive(){$('live').style.display='none'}
function quick(cat){openSection('live','k',()=>loadList(BASE+'categories/'+cat+'.m3u',cat))}

function renderSide(){
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));
 const L=$('sideList');
 const item=(u,l,ic,n)=>`<div class="it ${curKey===u?'on':''}" tabindex="0" data-u="${esc(u)}" data-l="${esc(ic+' '+n)}"><span>${ic} ${esc(n)}</span></div>`;
 if(tab==='c'){
  L.innerHTML=COUNTRIES.map(x=>item(BASE+'countries/'+x[0]+'.m3u',x[0],flag(x[0]),lang==='ar'?x[1]:x[2])).join('');
 }else if(tab==='k'){
  L.innerHTML=CATS.map(x=>item(BASE+'categories/'+x[0]+'.m3u',x[0],x[1],lang==='ar'?x[2]:x[3])).join('');
 }else if(tab==='f'){
  L.innerHTML=`<div class="it ${curKey==='fav'?'on':''}" tabindex="0" data-u="fav" data-l="⭐ ${t('fav')}"><span>⭐ ${t('fav')} (${favs.length})</span></div>`;
 }else if(tab==='r'){
  L.innerHTML=`<div class="it ${curKey==='recent'?'on':''}" tabindex="0" data-u="recent" data-l="🕒 ${t('tRecent')}"><span>🕒 ${t('tRecent')} (${recent.length})</span></div>`;
 }
}

function loadList(url,key){
 curKey=url==='fav'||url==='recent'?url:key;
 curLabel=key;
 if(url==='fav'){cur=favs;renderCh();return}
 if(url==='recent'){cur=recent;renderCh();return}
 if(cache[url]){cur=cache[url];renderCh();return}
 $('chList').innerHTML=`<div class="ld">${t('loading')}</div>`;
 fetch(url).then(r=>r.text()).then(txt=>{
  parseM3U(txt,url);
 }).catch(()=>{loadCustomList(url)});
}

function loadCustomList(url){
 fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url))
 .then(r=>r.text()).then(txt=>{
  parseM3U(txt,url);
 }).catch(()=>{alert(t('fail'));$('chList').innerHTML=`<div class="ld">${t('fail')}</div>`});
}

function parseM3U(txt,url){
 const lines=txt.split('\n');
 let list=[],cName='',cLogo='';
 for(let l of lines){
  l=l.trim();
  if(l.startsWith('#EXTINF:')){
   const m=l.match(/tvg-logo="([^"]*)"/);
   cLogo=m?m[1]:'';
   const parts=l.split(',');
   cName=parts[parts.length-1].trim();
  }else if(l&&!l.startsWith('#')){
   list.push({name:cName||'Channel',logo:cLogo,url:l});
   cName='';cLogo='';
  }
 }
 cache[url]=list;cur=list;renderCh();
}

function addCustom(){
 const u=$('mUrl').value.trim();
 if(!u)return;
 closeM('mPl');
 loadList(u,u);
}

let view=[];
function renderCh(){
 const q=($('cs').value||'').toLowerCase();
 view=cur.filter(x=>x.name.toLowerCase().includes(q));
 $('cnt').textContent=`${view.length} ${t('ch')}`;
 if(!view.length){$('chList').innerHTML=`<div class="ld">${t('empty')}</div>`;return}
 $('chList').innerHTML=view.map((x,i)=>{
  const isFav=favs.some(f=>f.url===x.url);
  const lg=x.logo?`<img src="${esc(x.logo)}" onerror="this.replaceWith(document.createElement('i')).textContent='📺'">`:`<i>📺</i>`;
  return `<div class="ch" tabindex="0" data-i="${i}"><span class="star ${isFav?'on':''}" data-fav="${i}">★</span>${lg}<div class="n">${esc(x.name)}</div></div>`;
 }).join('');
}

function toggleFav(idx){
 const item=view[idx];
 const ex=favs.findIndex(x=>x.url===item.url);
 if(ex>=0)favs.splice(ex,1);else favs.push(item);
 LS.s('favs',favs);
 renderCh();
}

function play(c){
 if(!c)return;activeUrl=c.url;
 let u=c.url;
 if(location.protocol==='https:'&&u.startsWith('http://')){
  u='https://api.allorigins.win/raw?url='+encodeURIComponent(u);
 }
 recent=[c,...recent.filter(x=>x.url!==c.url)].slice(0,30);LS.s('recent',recent);
 if(LS.g('ext',false)){window.open(c.url,'_blank');return}
 $('np').innerHTML=`<b>${esc(c.name)}</b><span>● ${t('live')}</span>`;
 const v=$('v'),m=$('msg'),tok=play.n=(play.n||0)+1,stale=()=>tok!==play.n;
 const show=x=>{m.textContent=x;m.style.display='flex'};
 const ok=()=>{if(stale())return;clearTimeout(play.t);m.style.display='none'};
 const bad=why=>{if(stale())return;clearTimeout(play.t);show(t('err')+' ['+why+']')};
 const hlsOK=!!(window.Hls&&Hls.isSupported());
 const reset=()=>{clearTimeout(play.t);if(hls){hls.destroy();hls=null}v.onerror=null;v.onplaying=null;v.pause();v.removeAttribute('src');v.load();$('qSel').innerHTML='<option value="-1">Auto</option>'};
 const timer=()=>{play.t=setTimeout(()=>{if(!stale()&&v.readyState<3)next('timeout')},12000)};
 const nat=()=>{reset();v.onplaying=ok;v.onerror=()=>next('native '+(v.error?v.error.code:''));v.src=u;v.play().catch(()=>{});timer()};
 const hp=()=>{reset();hls=new Hls({enableWorker:true,lowLatencyMode:true,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1});v.onplaying=ok;
  hls.loadSource(u);hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED,(e,d)=>{$('qSel').innerHTML='<option value="-1">Auto</option>'+d.levels.map((l,i)=>`<option value="${i}">${l.height?l.height+'p':Math.round(l.bitrate/1000)+'k'}</option>`).join('');v.play().catch(()=>{})});
  let rec=0;hls.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal)return;if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!rec++){hls.recoverMediaError();return}next('hls '+d.details+(d.response?' '+d.response.code:''))});timer()};
 const order=(location.protocol==='file:'||!hlsOK)?[nat,hp]:[hp,nat];
 if(!hlsOK)order.pop();
 const next=why=>{if(stale())return;const f=order.shift();f?f():bad(why)};
 show(t('loading'));next();
}

function setQ(v){if(hls){hls.currentLevel=+v}}
function fs(){const v=$('v');if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitRequestFullscreen)v.webkitRequestFullscreen()}
function pip(){const v=$('v');if(document.pictureInPictureElement)document.exitPictureInPicture();else if(v.requestPictureInPicture)v.requestPictureInPicture()}
function aspect(){const v=$('v');v.style.objectFit=v.style.objectFit==='cover'?'fill':v.style.objectFit==='fill'?'none':'cover'}
function mute(){const v=$('v');v.muted=!v.muted}
function zap(d){
 const idx=view.findIndex(x=>x.url===activeUrl);
 if(idx>=0){const nxt=view[idx+d];if(nxt)play(nxt)}
}
function scr(id,dir){const el=$(id);if(el)el.scrollBy({top:dir*180,behavior:'smooth'});}
function openSection(sec,tb,after){if(sec==='live'){openLive(tb,after)}}
function renderHome(){
 const last=LS.g('last',null);
 if(last){$('contBtn').style.display='inline-flex';$('contName').textContent=last.name}
}
function continueLast(){
 const last=LS.g('last',null);
 if(last){openLive('r',()=>{play(last)})};
}
function gsearch(q){
 if(!q)return;
 openLive('c',()=>{
  $('cs').value=q;
  renderCh();
 });
}
